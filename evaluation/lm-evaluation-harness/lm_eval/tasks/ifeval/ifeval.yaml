task: ifeval
dataset_path: json
dataset_name: null
dataset_kwargs:
  data_files:
    train: /mnt/shared-storage-user/renqihan/sft_generalization/evaluation/data/ifeval/train.jsonl
output_type: generate_until
test_split: train
num_fewshot: 0
doc_to_text: "{{'Question: ' + prompt + '\nAnswer:'}}"
doc_to_target: 0
repeats: 1
generation_kwargs:
  until: []
  do_sample: true
  temperature: 0.6
  max_gen_toks: 1280
process_results: !function utils.process_results
metric_list:
  - metric: prompt_level_strict_acc
    aggregation: mean
    higher_is_better: true
  - metric: inst_level_strict_acc
    aggregation: !function utils.agg_inst_level_acc
    higher_is_better: true
  - metric: prompt_level_loose_acc
    aggregation: mean
    higher_is_better: true
  - metric: inst_level_loose_acc
    aggregation: !function utils.agg_inst_level_acc
    higher_is_better: true
metadata:
  version: 4.0
